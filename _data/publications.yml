# Selected work, ordered to tell the research story rather than by date.
# Authors and venues checked against the papers and official project pages.
main:
  - id: seeact
    name: SeeAct
    title: "GPT-4V(ision) is a Generalist Web Agent, if Grounded"
    summary: "A multimodal agent for real websites, showing that grounding model predictions in actionable page elements is key to reliable web interaction."
    authors:
      - name: Boyuan Zheng
      - name: Boyu Gou
      - name: Jihyung Kil
      - name: Huan Sun
      - name: Yu Su
    venue: ICML
    year: 2024
    links:
      - label: Paper
        url: https://proceedings.mlr.press/v235/zheng24e.html
      - label: Code
        url: https://github.com/OSU-NLP-Group/SeeAct
      - label: Project
        url: https://osu-nlp-group.github.io/SeeAct/
    image: /assets/img/seeact.jpg
    image_alt: "SeeAct web-agent framework"

